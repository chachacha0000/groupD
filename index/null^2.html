<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Text Scramble Effect</title>
<style>
  body {
    background-color: #0a0a0a;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    /* 等幅フォントを指定すると文字幅が変わらず綺麗に揃う */
    font-family: 'Courier New', Consolas, monospace;
  }

  .scramble-text {
    font-size: 2.5rem;
    letter-spacing: 0.1em;
    cursor: pointer;
  }
</style>
</head>
<body>

  <!-- data-text属性に最終表示したい文字列を入れる -->
  <div class="scramble-text" data-text="DEEP FAKE">DEEP FAKE</div>

<script>
class TextScramble {
  constructor(el) {
    this.el = el;
    // ランダムに表示させる記号や文字のセット
    this.chars = '!<>-_\\/[]{}—=+*^?#01________';
    this.update = this.update.bind(this);
  }

  setText(newText) {
    const oldText = this.el.innerText;
    const length = Math.max(oldText.length, newText.length);
    const promise = new Promise((resolve) => (this.resolve = resolve));
    this.queue = [];

    for (let i = 0; i < length; i++) {
      const from = oldText[i] || '';
      const to = newText[i] || '';
      // 変化が始まるタイミングと終わるタイミングをランダムに設定
      const start = Math.floor(Math.random() * 100);    //最後の数値が最大フレーム数を表す
      const end = start + Math.floor(Math.random() * 100);  //最後の数値が最大フレーム数を表す
      this.queue.push({ from, to, start, end });
    }

    cancelAnimationFrame(this.frameRequest);
    this.frame = 0;
    this.update();
    return promise;
  }

  update() {
    let output = '';
    let complete = 0;

    for (let i = 0, n = this.queue.length; i < n; i++) {
      let { from, to, start, end, char } = this.queue[i];

      if (this.frame >= end) {
        complete++;
        output += to;
      } else if (this.frame >= start) {
        // 一定確率でランダムな記号を入れ替える
        if (!char || Math.random() < 0.28) {
          char = this.randomChar();
          this.queue[i].char = char;
        }
        // 変化途中の文字に薄い色をつけてノイズ感を出す
        output += `<span style="opacity: 0.5;">${char}</span>`;
      } else {
        output += from;
      }
    }

    this.el.innerHTML = output;

    if (complete === this.queue.length) {
      this.resolve();
    } else {
      this.frameRequest = requestAnimationFrame(this.update);
      this.frame++;
    }
  }

  randomChar() {
    return this.chars[Math.floor(Math.random() * this.chars.length)];
  }
}

// 実行処理
const target = document.querySelector('.scramble-text');
const fx = new TextScramble(target);

// ページ読み込み時に実行
window.addEventListener('load', () => {
  fx.setText(target.dataset.text);
});

// マウスを乗せた時にも再実行
target.addEventListener('mouseenter', () => {
  fx.setText(target.dataset.text);
});
</script>

</body>
</html>
