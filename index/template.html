<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>グループプロジェクト</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body>

  <!-- 【最重要パーツ1】全ページ共通のヘッダー -->
  <header class="l-header">
    <div class="logo">null² Motif</div>
    <nav class="nav-menu">
      <!-- 実際のハンバーガーメニュー等はここに入れます -->
      <span>JA | EN ≡</span>
    </nav>
  </header>

  <!-- 【最重要パーツ2】コンテンツをまとめる大枠（コンテナ） -->
  <main class="l-container">

    <!-- ▼▼▼ メンバー作業領域：ここから下に各担当者が書いていく ▼▼▼ -->
    
    <!-- セクションのひな形（例：歴史担当） -->
    <section class="c-section">
      <h2 class="c-section-title">- HISTORY - 歴史について</h2><!--ここがタイトル-->
      <div class="c-section-content">
        <!-- 担当者はここに文章や画像を入れていく -->
        <p>ここに歴史のテキストが入ります。</p>
      </div>
    </section>

    <!-- ▲▲▲ メンバー作業領域：ここまで ▲▲▲ -->

  </main>

  <!-- 【最重要パーツ3】全ページ共通のフッター -->
  <footer class="l-footer">
    <p>&copy; 2026 Group Project</p>
  </footer>

</body>
</html>
